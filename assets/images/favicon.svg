<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label=".NET Core Logo">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Dark Squircle -->
  <rect width="128" height="128" rx="28" fill="#0b0f19" />
  
  <!-- Subtle Gradient Border -->
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" opacity="0.85" />
  
  <!-- Glowing Core -->
  <circle cx="64" cy="64" r="46" fill="url(#brandGrad)" opacity="0.12" filter="url(#softGlow)" />

  <!-- Outer Hexagonal Tech Shield -->
  <path d="M64 16 L104 39 L104 89 L64 112 L24 89 L24 39 Z" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="2" 
        stroke-linejoin="round" 
        opacity="0.4" />

  <!-- .NET Monogram -->
  <g filter="url(#softGlow)">
    <!-- Cyan dot -->
    <circle cx="28" cy="74" r="6" fill="#38bdf8" />
    
    <!-- NET Text -->
    <text x="38" y="78" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="34" 
          font-weight="900" 
          fill="url(#textGrad)" 
          letter-spacing="-1">NET</text>
  </g>
</svg>