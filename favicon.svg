<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label=".NET Documentation Portal">
  <defs>
    <linearGradient id="dotnetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#512bd4" />
      <stop offset="60%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="dotnetBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="dotnetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#512bd4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base with Official .NET Purple Gradient -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#dotnetBg)" />
  
  <!-- Subtle Inner Border -->
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" fill="none" stroke="url(#dotnetBorder)" stroke-width="2.5" opacity="0.65" />
  
  <!-- Inner Glow Ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" />

  <!-- .NET Typography & Dot -->
  <g filter="url(#dotnetShadow)">
    <!-- Signature Dot -->
    <circle cx="28" cy="78" r="7" fill="#ffffff" />
    <circle cx="28" cy="78" r="4" fill="#a78bfa" />
    
    <!-- NET Letters -->
    <text x="38" y="82" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="36" 
          font-weight="900" 
          fill="url(#textGrad)" 
          letter-spacing="-1.5">NET</text>
  </g>
</svg>
